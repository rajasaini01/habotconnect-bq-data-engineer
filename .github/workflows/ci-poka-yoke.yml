# Poka-Yoke Build Gate — Task 2
# Candidate: Raja Saini | rajasaini092004@gmail.com
#
# Fail-closed gate: blocks a merge on bad formatting, failed lint, invalid
# Terraform, or a detected secret. No step swallows a failure, and branch
# protection (see README) requires this check before merge.

name: Poka-Yoke Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform fmt (check only, no auto-fix)
        working-directory: terraform
        run: terraform fmt -check -diff -recursive

      - name: Terraform init (backend disabled — validate is offline)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

  python-lint-and-format:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install flake8==7.1.1 black==24.8.0

      - name: flake8 (lint)
        run: flake8 data_pipeline/ --max-line-length=100

      - name: black (format check only, no auto-fix)
        run: black --check data_pipeline/

  secret-scan:
    name: Secret Scan (Fail-Closed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"
        # Exits non-zero on any finding, which fails this job — nothing here
        # downgrades that to a warning.

  # Single named status for branch protection to require, instead of listing
  # all three job names in the merge rule.
  build-gate-passed:
    name: Build Gate Passed
    runs-on: ubuntu-latest
    needs: [terraform-checks, python-lint-and-format, secret-scan]
    steps:
      - name: All checks passed
        run: echo "Terraform, lint, and secret scan all passed. Build gate clear."
